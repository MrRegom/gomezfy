<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GomezTube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Configuración PWA para Android e iOS (Pantalla Completa Nativa) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GomezTube">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f0f0f">

  <!-- Hoja de Estilos Oficial GomezTube Estilo YouTube Dark -->
  <link rel="stylesheet" href="/css/app.css">

  <!-- Google Cast Web Sender SDK para Smart TVs y Chromecast -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" defer></script>
</head>
<body class="yt-theme-dark">

  <!-- =========================================================================
       1. Barra Superior Oficial Estilo YouTube (Masthead)
       ========================================================================= -->
  <header class="yt-masthead" id="ytMasthead">
    
    <!-- Sección Izquierda: Menú Hamburguesa + Logo Oficial -->
    <div class="masthead-start">
      <button type="button" class="yt-icon-button" id="btnMenuToggle" title="Guía de navegación" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <a href="/" class="yt-brand-logo" id="btnLogoHome" title="Página principal de GomezTube" aria-label="GomezTube Home">
        <span class="yt-logo-badge">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#ffffff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </span>
        <span class="yt-brand-text">Gomez<span class="yt-brand-text-accent">Tube</span></span>
        <span class="yt-country-code">CL</span>
      </a>
    </div>

    <!-- Sección Central: Barra de Búsqueda Estilo Píldora + Micrófono -->
    <div class="masthead-center">
      <div class="yt-search-form">
        <div class="yt-searchbox-input-wrapper">
          <input
            type="search"
            id="inputSearch"
            class="yt-searchbox-input"
            placeholder="Buscar"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
          >
          <button type="button" id="btnClearSearch" class="yt-searchbox-clear-btn" style="display: none;" title="Borrar búsqueda">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <button type="button" class="yt-search-submit-btn" id="btnSearchSubmit" title="Buscar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>

      <button type="button" class="yt-mic-button" id="btnVoiceSearch" title="Búsqueda por voz">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
    </div>

    <!-- Sección Derecha: Acciones de Usuario (Crear, Campana, Avatar) -->
    <div class="masthead-end">
      <button type="button" class="yt-btn-create" id="btnAdFreeBadge" title="Reproducción libre de anuncios garantizada">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
        <span>Sin anuncios</span>
      </button>

      <button type="button" class="yt-icon-button yt-notif-button" id="btnNotifications" title="Notificaciones">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="yt-notif-badge">9+</span>
      </button>

      <div class="yt-user-avatar-btn" id="btnUserAvatar" title="Cuenta de usuario">R</div>
    </div>
  </header>

  <!-- =========================================================================
       2. Contenedor de Aplicación (Sidebar + Contenido Principal)
       ========================================================================= -->
  <div class="yt-app-layout" id="ytAppLayout">
    
    <!-- Sidebar Colapsable / Mini-Sidebar Estilo YouTube Desktop -->
    <aside class="yt-sidebar" id="ytSidebar" aria-label="Menú principal">
      <nav class="yt-guide-section">
        <button type="button" class="yt-guide-item active" data-view="feed" id="navItemHome" title="Página principal">
          <span class="yt-guide-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </span>
          <span class="yt-guide-label">Principal</span>
        </button>

        <button type="button" class="yt-guide-item" data-action="chip" data-query="musica en vivo" title="Música en vivo">
          <span class="yt-guide-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          </span>
          <span class="yt-guide-label">Música</span>
        </button>

        <button type="button" class="yt-guide-item" data-action="chip" data-query="nomad worship" title="Nomad Worship">
          <span class="yt-guide-icon yt-guide-icon-nomad">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
          </span>
          <span class="yt-guide-label">Nomad Worship</span>
        </button>

        <button type="button" class="yt-guide-item" data-action="chip" data-query="paracas" title="Paracas - Álbum 1978">
          <span class="yt-guide-icon yt-guide-icon-paracas">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
          </span>
          <span class="yt-guide-label">Paracas 1978</span>
        </button>

        <button type="button" class="yt-guide-item" data-view="library" id="navItemLibrary" title="Tu biblioteca">
          <span class="yt-guide-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          </span>
          <span class="yt-guide-label">Tú</span>
        </button>
      </nav>
    </aside>

    <!-- Overlay oscuro para Sidebar en móviles / tablets -->
    <div class="yt-sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Contenido Central Dinámico -->
    <main class="yt-main-content" id="mainContent">

      <!-- =====================================================================
           VISTA 1: Feed Principal y Resultados de Búsqueda
           ===================================================================== -->
      <section class="app-view active" id="viewFeed">
        
        <!-- Carrusel de Categorías / Chips Superiores (Estilo YouTube oficial) -->
        <div class="yt-chips-container" role="tablist" aria-label="Categorías">
          <div class="yt-chips-scroll">
            <button type="button" class="yt-chip active" data-query="tendencias" role="tab">Todos</button>
            <button type="button" class="yt-chip chip-nomad" data-query="nomad worship" role="tab">Nomad Worship</button>
            <button type="button" class="yt-chip chip-paracas" data-query="paracas" role="tab">Paracas (Álbum 1978)</button>
            <button type="button" class="yt-chip" data-query="musica en vivo" role="tab">Música</button>
            <button type="button" class="yt-chip" data-query="podcast completo" role="tab">Podcasts</button>
            <button type="button" class="yt-chip" data-query="tecnologia" role="tab">Programación</button>
            <button type="button" class="yt-chip" data-query="futbol goles resumen" role="tab">Fútbol</button>
            <button type="button" class="yt-chip" data-query="noticias en vivo" role="tab">Noticias</button>
            <button type="button" class="yt-chip" data-query="gameplay español" role="tab">Videojuegos</button>
            <button type="button" class="yt-chip" data-query="documental" role="tab">Documentales</button>
          </div>
        </div>

        <!-- Banner Opcional de Colecciones (Solo visible en Home inicial, se OCULTA al buscar) -->
        <section class="yt-featured-shelf" id="featuredShelf" aria-label="Colecciones especiales">
          <div class="shelf-header">
            <h3 class="shelf-title">Artistas y Álbumes Destacados</h3>
          </div>
          <div class="featured-collections-grid">
            
            <!-- Nomad Worship -->
            <article class="featured-artist-card card-nomad" id="featuredNomadCard">
              <div class="featured-card-content">
                <span class="featured-card-tag tag-nomad">Artista Recomendado</span>
                <h3 class="featured-card-title">NOMAD WORSHIP</h3>
                <p class="featured-card-subtitle">Música oficial, sesiones en vivo y adoración.</p>
                <div class="featured-card-actions">
                  <button type="button" class="btn-featured-play" id="btnPlayNomadLatest">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <span>Reproducir "Un Paso"</span>
                  </button>
                  <button type="button" class="btn-featured-browse" id="btnBrowseNomad">
                    <span>Ver catálogo</span>
                  </button>
                </div>
              </div>
              <div class="featured-card-media">
                <img src="https://i.ytimg.com/vi/p34Oop-WnjQ/hq720.jpg" alt="Nomad Worship Portada" class="featured-cover-img" loading="lazy">
              </div>
            </article>

            <!-- Paracas 1978 -->
            <article class="featured-artist-card card-paracas" id="featuredParacasCard">
              <div class="featured-card-content">
                <span class="featured-card-tag tag-paracas">Álbum Histórico 1978</span>
                <h3 class="featured-card-title">PARACAS - Sueños en el aire</h3>
                <p class="featured-card-subtitle">7 pistas completas restauradas (EMI - Odeón 1978).</p>
                <div class="featured-card-actions">
                  <button type="button" class="btn-featured-play btn-paracas-play" id="btnPlayParacasAlbum">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <span>Reproducir Álbum</span>
                  </button>
                  <button type="button" class="btn-featured-browse" id="btnBrowseParacas">
                    <span>Ver 7 Canciones</span>
                  </button>
                </div>
              </div>
              <div class="featured-card-media">
                <img src="https://i.ytimg.com/vi/t4IKvJrPyEY/hqdefault.jpg" alt="Paracas Portada" class="featured-cover-img" loading="lazy">
              </div>
            </article>

          </div>
        </section>

        <!-- Cabecera del Feed de Videos -->
        <div class="feed-header-bar" id="feedHeaderBar">
          <h2 class="section-heading" id="sectionTitle">Tendencias</h2>
        </div>

        <!-- Grilla de Videos Principal (Idéntica a YouTube Desktop/Mobile) -->
        <div class="video-cards-grid" id="videoGrid"></div>
      </section>

      <!-- =====================================================================
           VISTA 2: Watch Page Layout Estilo YouTube Real (2 Columnas - Imagen 2)
           ===================================================================== -->
      <section class="app-view" id="viewWatch" aria-label="Reproducción de video">
        <div class="yt-watch-layout">
          
          <!-- Columna Principal Izquierda (Reproductor + Detalles del Video) -->
          <div class="yt-watch-primary-column">
            
            <!-- Contenedor del Reproductor 16:9 Limpio sin Anuncios -->
            <div class="watch-player-theater" id="watchPlayerTheater"></div>

            <!-- Información Completa del Video -->
            <div class="watch-video-details" id="watchVideoDetails"></div>

          </div>

          <!-- Columna Lateral Derecha (Videos Relacionados / Siguientes) -->
          <div class="yt-watch-secondary-column">
            <div class="related-header-row">
              <h3 class="related-heading" id="relatedHeading">A continuación</h3>
              <button type="button" class="btn-close-watch-view" id="btnCloseWatchView" title="Volver a la página principal">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
            <div class="related-videos-list" id="watchRelatedList"></div>
          </div>

        </div>
      </section>

      <!-- =====================================================================
           VISTA 3: Biblioteca (Guardados e Historial)
           ===================================================================== -->
      <section class="app-view" id="viewLibrary">
        <div class="library-header-bar">
          <h2 class="section-heading">Tu Biblioteca</h2>
          <button type="button" class="btn-text-danger" id="btnLimpiarHistorial" style="display: none;">Vaciar historial</button>
        </div>

        <div class="library-subtabs-row">
          <button type="button" class="subtab-btn active" id="btnTabFavoritos">Guardados</button>
          <button type="button" class="subtab-btn" id="btnTabHistorial">Historial</button>
        </div>

        <div class="video-cards-grid" id="libraryGrid"></div>
      </section>

    </main>
  </div>

  <!-- =========================================================================
       3. Barra de Navegación Inferior para Móviles (Android e iOS)
       ========================================================================= -->
  <nav class="bottom-navigation-bar" aria-label="Navegación móvil">
    <button type="button" class="nav-tab-btn active" data-view="feed" title="Principal">
      <span class="nav-tab-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </span>
      <span class="nav-tab-label">Principal</span>
    </button>
    <button type="button" class="nav-tab-btn" data-action="chip" data-query="nomad worship" title="Nomad">
      <span class="nav-tab-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
      </span>
      <span class="nav-tab-label">Nomad</span>
    </button>
    <button type="button" class="nav-tab-btn" data-action="chip" data-query="paracas" title="Paracas">
      <span class="nav-tab-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
      </span>
      <span class="nav-tab-label">Paracas</span>
    </button>
    <button type="button" class="nav-tab-btn" data-view="library" title="Tú">
      <span class="nav-tab-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </span>
      <span class="nav-tab-label">Tú</span>
    </button>
  </nav>

  <!-- Controlador Modular (Sin código JS incrustado) -->
  <script type="module" src="/js/app_controller.js"></script>
</body>
</html>
