name: Compilar IPA iOS (Gomezfy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Actualizar assets web directamente en proyecto Xcode
        run: |
          mkdir -p ios/App/App/public
          cp -r css js icons index.html manifest.json sw.js ios/App/App/public/

      - name: Resolver dependencias Swift Package Manager
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Compilar App nativa iOS (ARM64)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild build \
                     -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" > xcode_build.log 2>&1 || {
            echo "### ❌ Error detallado de Xcode" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 45 xcode_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 xcode_build.log
            exit 1
          }

      - name: Empaquetar como Gomezfy.ipa para Sideloadly
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../Gomezfy.ipa Payload
          cd ../..
          echo "### ✅ ¡Compilación Exitosa!" >> $GITHUB_STEP_SUMMARY
          echo "El instalador **Gomezfy.ipa** se ha generado correctamente y está listo en la sección **Artifacts** abajo." >> $GITHUB_STEP_SUMMARY

      - name: Subir Gomezfy.ipa a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gomezfy-iOS-IPA
          path: Gomezfy.ipa
          retention-days: 14
