name: Compilar IPA iOS (Gomezfy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Actualizar assets web directamente en proyecto Xcode
        run: |
          mkdir -p ios/App/App/public
          cp -r css js icons index.html manifest.json sw.js ios/App/App/public/

      - name: Resolver dependencias Swift Package Manager
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Compilar App nativa iOS (ARM64 Ad-Hoc)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild build \
                     -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Empaquetar como Gomezfy.ipa para Sideloadly
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../Gomezfy.ipa Payload
          cd ../..

      - name: Subir Gomezfy.ipa a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gomezfy-iOS-IPA
          path: Gomezfy.ipa
          retention-days: 14
