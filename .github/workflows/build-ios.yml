name: Compilar IPA iOS (Gomezfy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Copiar archivos web a iOS
        run: |
          node build_www.js
          npx cap copy ios

      - name: Compilar App con Xcode (ARM64 para iPhone Físico)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar como Gomezfy.ipa
        run: |
          cd ios/App
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../Gomezfy.ipa Payload
          cd ../..

      - name: Subir Gomezfy.ipa a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gomezfy-iOS-IPA
          path: Gomezfy.ipa
          retention-days: 14
