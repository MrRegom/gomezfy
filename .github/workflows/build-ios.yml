name: Compilar IPA iOS (Gomezfy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar compilación web
        run: |
          node build_www.js
          mkdir -p ios/App/App/public
          cp -r www/* ios/App/App/public/

      - name: Resolver dependencias Swift Package Manager
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Compilar App nativa iOS (ARM64 Ad-Hoc / Sin Firma)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild clean build \
                     -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || {
            echo "::error::Falló la compilación de Xcode"
            echo "=== LINEAS DE ERROR ==="
            grep -in "error:" xcodebuild.log || true
            echo "=== ULTIMAS 80 LINEAS DEL LOG ==="
            tail -n 80 xcodebuild.log
            exit 1
          }

      - name: Empaquetar como Gomezfy.ipa para Sideloadly / AltStore
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../Gomezfy.ipa Payload
          cd ../..

      - name: Subir Gomezfy.ipa a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gomezfy-iOS-IPA
          path: Gomezfy.ipa
          retention-days: 14

      - name: Diagnóstico en caso de error
        if: failure()
        run: |
          echo "### Log detallado de xcodebuild" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 ios/App/xcodebuild.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
