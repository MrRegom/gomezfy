<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GomezTube - Videos sin Comerciales</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Configuración PWA para iOS iPhone y Android (Standalone Pantalla Completa) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GomezTube">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f0f0f">

  <!-- Hoja de Estilo GomezTube Premium -->
  <link rel="stylesheet" href="/css/app.css">

  <!-- Google Cast Web Sender SDK para Smart TVs y Chromecast -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" defer></script>
</head>
<body>

  <!-- Barra Superior de Navegación -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-badge" role="banner">
        <span class="brand-logo-icon">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </span>
        <span class="brand-logo-text">Gomez<span class="brand-logo-accent">Tube</span></span>
      </div>

      <div class="search-bar-wrapper">
        <div class="search-input-box">
          <span class="search-icon-prefix">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input
            type="search"
            id="inputSearch"
            class="search-input"
            placeholder="Buscar videos, canales o temas..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
          >
          <button type="button" id="btnClearSearch" class="btn-clear-search" style="display: none;" title="Limpiar búsqueda">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Píldoras de Categorías Rápidas (Estilo YouTube oficial, sin emojis) -->
    <div class="categories-carousel" role="tablist" aria-label="Categorías">
      <button type="button" class="category-chip active" data-query="tendencias" role="tab">Tendencias</button>
      <button type="button" class="category-chip chip-nomad" data-query="nomad worship" role="tab">Nomad Worship</button>
      <button type="button" class="category-chip chip-paracas" data-query="paracas" role="tab">Paracas - Álbum 1978</button>
      <button type="button" class="category-chip" data-query="musica en vivo" role="tab">Música</button>
      <button type="button" class="category-chip" data-query="podcast completo" role="tab">Podcasts</button>
      <button type="button" class="category-chip" data-query="tecnologia" role="tab">Tecnología</button>
      <button type="button" class="category-chip" data-query="gameplay español" role="tab">Gaming</button>
      <button type="button" class="category-chip" data-query="noticias en vivo" role="tab">Noticias</button>
      <button type="button" class="category-chip" data-query="documental" role="tab">Documentales</button>
    </div>
  </header>

  <!-- Área de Reproducción de Video (Fijable o Desplazable) -->
  <section class="video-theater-container hidden" id="playerSection" aria-label="Reproductor de video"></section>
  <section class="video-theater-info hidden" id="playerInfoSection" aria-label="Información del video"></section>

  <!-- Contenido Principal -->
  <main class="main-content-layout">
    
    <!-- Vista 1: Feed Principal / Resultados -->
    <section class="app-view active" id="viewFeed">
      
      <!-- Contenedor de Colecciones Destacadas Permanentes -->
      <section class="featured-collections-grid" aria-label="Colecciones y artistas destacados">
        
        <!-- Tarjeta 1: Nomad Worship -->
        <article class="featured-artist-card card-nomad" id="featuredNomadCard" aria-label="Grupo destacado: Nomad Worship">
          <div class="featured-card-content">
            <span class="featured-card-tag tag-nomad">Artista Destacado</span>
            <h2 class="featured-card-title">NOMAD WORSHIP</h2>
            <p class="featured-card-subtitle">Música oficial, sesiones en vivo y adoración.</p>
            <div class="featured-card-actions">
              <button type="button" class="btn-featured-play" id="btnPlayNomadLatest" title="Reproducir último lanzamiento">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <span>Reproducir "Un Paso"</span>
              </button>
              <button type="button" class="btn-featured-browse" id="btnBrowseNomad" title="Ver catálogo completo de Nomad Worship">
                <span>Ver videos</span>
              </button>
            </div>
          </div>
          <div class="featured-card-media">
            <img src="https://i.ytimg.com/vi/p34Oop-WnjQ/hq720.jpg" alt="Nomad Worship Portada" class="featured-cover-img" loading="lazy">
          </div>
        </article>

        <!-- Tarjeta 2: Paracas - Sueños en el Aire (Álbum 1978 EMI-Odeón) -->
        <article class="featured-artist-card card-paracas" id="featuredParacasCard" aria-label="Álbum destacado: Paracas - Sueños en el aire">
          <div class="featured-card-content">
            <span class="featured-card-tag tag-paracas">Álbum Histórico 1978</span>
            <h2 class="featured-card-title">PARACAS - Sueños en el aire</h2>
            <p class="featured-card-subtitle">Álbum de 7 canciones grabado en EMI - Odeón (1978).</p>
            <div class="featured-card-actions">
              <button type="button" class="btn-featured-play btn-paracas-play" id="btnPlayParacasAlbum" title="Reproducir álbum completo">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <span>Reproducir Álbum</span>
              </button>
              <button type="button" class="btn-featured-browse" id="btnBrowseParacas" title="Ver las 7 canciones del álbum">
                <span>Ver 7 Canciones</span>
              </button>
            </div>
          </div>
          <div class="featured-card-media">
            <img src="https://i.ytimg.com/vi/t4IKvJrPyEY/hqdefault.jpg" alt="Paracas Sueños en el aire Portada" class="featured-cover-img" loading="lazy">
          </div>
        </article>

      </section>

      <div class="feed-header-bar">
        <h2 class="section-heading" id="sectionTitle">Tendencias</h2>
        <span class="badge-adfree">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
          Sin anuncios
        </span>
      </div>
      <div class="video-cards-grid" id="videoGrid"></div>
    </section>

    <!-- Vista 2: Biblioteca (Guardados e Historial) -->
    <section class="app-view" id="viewLibrary">
      <div class="library-header-bar">
        <h2 class="section-heading">Tu Biblioteca</h2>
        <button type="button" class="btn-text-danger" id="btnLimpiarHistorial" style="display: none;">Vaciar historial</button>
      </div>

      <div class="library-subtabs-row">
        <button type="button" class="subtab-btn active" id="btnTabFavoritos">Guardados</button>
        <button type="button" class="subtab-btn" id="btnTabHistorial">Historial</button>
      </div>

      <div class="video-cards-grid" id="libraryGrid"></div>
    </section>

  </main>

  <!-- Barra de Navegación Inferior Móvil (Estilo App Nativa) -->
  <nav class="bottom-navigation-bar" aria-label="Navegación principal">
    <button type="button" class="nav-tab-btn active" data-view="feed" title="Inicio">
      <span class="nav-tab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </span>
      <span class="nav-tab-label">Inicio</span>
    </button>
    <button type="button" class="nav-tab-btn" data-view="library" title="Biblioteca">
      <span class="nav-tab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </span>
      <span class="nav-tab-label">Biblioteca</span>
    </button>
  </nav>

  <!-- Controlador Modular (Sin JS incrustado) -->
  <script type="module" src="/js/app_controller.js"></script>
</body>
</html>
