name: Compilar IPA iOS (Gomezfy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar assets web en el bundle nativo
        run: |
          node build_www.js
          mkdir -p ios/App/App/public
          cp -r www/* ios/App/App/public/

      - name: Resolver dependencias Swift Package Manager
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Compilar App nativa iOS (ARM64 Ad-Hoc / Sin Firma)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild clean build \
                     -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || {
            echo "Falló la compilación de Xcode. Extrayendo errores exactos para anotaciones:"
            grep -i "error:" xcodebuild.log | tail -n 10 | while IFS= read -r line; do
              echo "::error file=ios/App/xcodebuild.log::$line"
            done
            tail -n 15 xcodebuild.log | while IFS= read -r line; do
              echo "::notice file=ios/App/xcodebuild.log::$line"
            done
            exit 1
          }

      - name: Empaquetar como Gomezfy.ipa para Sideloadly / AltStore
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../Gomezfy.ipa Payload
          cd ../..

      - name: Subir Gomezfy.ipa a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gomezfy-iOS-IPA
          path: Gomezfy.ipa
          retention-days: 14

      - name: Subir log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-compilation-log
          path: ios/App/xcodebuild.log
          retention-days: 7
